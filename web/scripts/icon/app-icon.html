<!doctype html>
<!-- Source of the app icon (docs/brand.md). Open in Chrome at 1024x1024 and
     capture #icon: as is for the full-bleed iOS/maskable files, with class
     "round" on #icon for the rounded manifest icons. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent}
.icon{position:relative;width:1024px;height:1024px;overflow:hidden}
.icon.round{border-radius:226px}
.layer{position:absolute;inset:0}
/* Bilinear aura gradient sampled from the Figma artwork: blue left, orange top
   right, magenta bottom right, navy bottom left. */
.top{background:linear-gradient(90deg,#44699a 0%,#7a6d84 50%,#c27c52 100%)}
.bottom{background:linear-gradient(90deg,#122265 0%,#551e60 50%,#9c1a4f 100%);
  -webkit-mask:linear-gradient(180deg,transparent 4%,#000 96%);mask:linear-gradient(180deg,transparent 4%,#000 96%)}
.letter{position:absolute;inset:0;width:1024px;height:1024px;filter:drop-shadow(-8px 12px 16px rgb(8 10 40 / .38))}
/* Figma: inner shadows along the rounded edge (x2 for 1024 px) and a thin
   rim; outside the rounded edge the same shade continues, so the iOS mask
   never shows an unshaded sliver in the corners. */
.bevel{border-radius:226px;box-shadow:0 0 0 240px rgb(3 16 22 / .82),inset -20px 20px 40px rgb(0 18 22 / .9),inset 40px -40px 60px rgb(1 17 21 / .7),inset 0 0 0 2px rgb(72 72 72 / .55)}
.refl{position:absolute;left:94px;top:21px;width:935px;height:959px}
