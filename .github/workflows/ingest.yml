name: refresh-data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only this source key (form4, insider-buys, house, 13f, names, prices); empty = all"
        required: false
        default: ""
      args:
        description: "Extra arguments for that source, e.g. --days 30 --dry-run"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: outsider-ingestion
  cancel-in-progress: false
jobs:
  source:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: SEC Form 4
            key: form4
            command: python -m outsider_ingest.pipelines.ingest_form4 --all
          - source: SEC Form 4 market-wide purchases
            key: insider-buys
            command: python -m outsider_ingest.pipelines.ingest_insider_buys --days 4
          - source: US House
            key: house
            # Late PTRs for December land in the previous year's index.
            command: python -m outsider_ingest.pipelines.ingest_house --year "$(date +%Y)" --year "$(date -d '-45 days' +%Y)"
          - source: SEC 13F
            key: 13f
            command: python -m outsider_ingest.pipelines.ingest_13f --all
          - source: Company names
            key: names
            command: python -m outsider_ingest.pipelines.refresh_company_names
          - source: EOD prices
            key: prices
            command: python -m outsider_ingest.pipelines.backfill_prices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == matrix.key }}
        run: pip install -r ingestion/requirements.txt
      - name: Import source
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == matrix.key }}
        working-directory: ingestion
        env:
          PYTHONPATH: .
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          # Stooq answers datacenter IPs with an HTML page; Yahoo leads.
          PRICE_PROVIDER: yahoo
          PRICE_FALLBACKS: stooq
          PYTHONUNBUFFERED: "1"
          EXTRA_ARGS: ${{ inputs.args }}
        run: ${{ matrix.command }} $EXTRA_ARGS
      - name: Record outcome
        if: ${{ always() }}
        env:
          SOURCE_NAME: ${{ matrix.source }}
          JOB_STATUS: ${{ job.status }}
        run: printf '%s — %s\n' "$SOURCE_NAME" "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
