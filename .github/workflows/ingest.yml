name: refresh-data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: outsider-ingestion
  cancel-in-progress: false
jobs:
  source:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: SEC Form 4
            command: python -m outsider_ingest.pipelines.ingest_form4 --all
          - source: US Senate
            command: python -m outsider_ingest.pipelines.ingest_senate
          - source: US House
            command: python -m outsider_ingest.pipelines.ingest_house --year "$(date +%Y)"
          - source: SEC 13F
            command: python -m outsider_ingest.pipelines.ingest_13f --all
          - source: EOD prices
            command: python -m outsider_ingest.pipelines.backfill_prices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt
      - name: Import source
        working-directory: ingestion
        env:
          PYTHONPATH: .
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          PRICE_PROVIDER: stooq
          PRICE_FALLBACKS: yahoo
        run: ${{ matrix.command }}
      - name: Record outcome
        if: ${{ always() }}
        env:
          SOURCE_NAME: ${{ matrix.source }}
          JOB_STATUS: ${{ job.status }}
        run: printf '%s — %s\n' "$SOURCE_NAME" "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
